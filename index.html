<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Chase</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b1f; font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px; color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.6); pointer-events: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; background: rgba(0,0,0,.45); }
  #overlay h1 { font-size: 48px; margin: 0 0 12px; }
  #overlay p { font-size: 20px; margin: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="hud"><span id="score">Score: 0</span><span id="time">Time: 60</span></div>
<div id="overlay">
  <h1 id="title">Cat Chase</h1>
  <p id="msg">Catch as many mice as you can in 60 seconds.</p>
  <p>WASD / Arrow keys to move &middot; Space to jump</p>
  <p><b>Press Space to start</b></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROUND_TIME = 60;
const ARENA = 14;          // half-size of the play field
const MOUSE_COUNT = 4;
const CAT_MAX_SPEED = 9, CAT_ACCEL = 30, CAT_FRICTION = 8;
const JUMP_SPEED = 9, GRAVITY = 25;
const CATCH_DIST = 1.3;

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3f0);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  // pull back further on narrow screens so the whole arena stays visible
  const dist = 30 * Math.max(1, 1.3 / camera.aspect);
  camera.position.set(0, dist * 0.95, dist * 0.6);
  camera.lookAt(0, 0, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitCamera);
fitCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(10, 25, 10);
sun.castShadow = true;
sun.shadow.camera.left = sun.shadow.camera.bottom = -20;
sun.shadow.camera.right = sun.shadow.camera.top = 20;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// floor + walls
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2, ARENA * 2),
  new THREE.MeshLambertMaterial({ color: 0x7cbf5a }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshLambertMaterial({ color: 0xb07a4a });
[[0, -ARENA, ARENA * 2 + 1, 1], [0, ARENA, ARENA * 2 + 1, 1],
 [-ARENA, 0, 1, ARENA * 2 + 1], [ARENA, 0, 1, ARENA * 2 + 1]].forEach(([x, z, w, d]) => {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 1, d), wallMat);
  wall.position.set(x, 0.5, z);
  wall.castShadow = wall.receiveShadow = true;
  scene.add(wall);
});

// ---------- cat ----------
function makeCat() {
  const g = new THREE.Group();
  const fur = new THREE.MeshLambertMaterial({ color: 0xf08a24 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x222222 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 1.6), fur);
  body.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.7), fur);
  head.position.set(0, 1.25, 0.95);
  const earGeo = new THREE.ConeGeometry(0.17, 0.35, 4);
  const earL = new THREE.Mesh(earGeo, fur); earL.position.set(-0.25, 1.75, 0.95);
  const earR = earL.clone(); earR.position.x = 0.25;
  const eyeGeo = new THREE.BoxGeometry(0.12, 0.12, 0.05);
  const eyeL = new THREE.Mesh(eyeGeo, dark); eyeL.position.set(-0.18, 1.32, 1.31);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.18;
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.1), fur);
  tail.position.set(0, 1.2, -0.95); tail.rotation.x = -0.6;
  const legGeo = new THREE.BoxGeometry(0.22, 0.45, 0.22);
  [[-0.3, 0.6], [0.3, 0.6], [-0.3, -0.6], [0.3, -0.6]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(legGeo, fur); leg.position.set(x, 0.22, z); g.add(leg);
  });
  g.add(body, head, earL, earR, eyeL, eyeR, tail);
  g.traverse(m => { if (m.isMesh) m.castShadow = true; });
  return g;
}
const cat = makeCat();
scene.add(cat);
const catState = { vx: 0, vz: 0, vy: 0, y: 0 };

// ---------- mice ----------
function makeMouse() {
  const g = new THREE.Group();
  const grey = new THREE.MeshLambertMaterial({ color: 0x9a9a9a });
  const pink = new THREE.MeshLambertMaterial({ color: 0xf2a0b0 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), grey);
  body.scale.set(1, 0.8, 1.4); body.position.y = 0.3;
  const earGeo = new THREE.SphereGeometry(0.13, 8, 6);
  const earL = new THREE.Mesh(earGeo, pink); earL.position.set(-0.17, 0.6, 0.3);
  const earR = earL.clone(); earR.position.x = 0.17;
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8), pink);
  tail.rotation.x = Math.PI / 2; tail.position.set(0, 0.25, -0.8);
  g.add(body, earL, earR, tail);
  g.traverse(m => { if (m.isMesh) m.castShadow = true; });
  return g;
}
const mice = [];
for (let i = 0; i < MOUSE_COUNT; i++) {
  const m = { mesh: makeMouse(), dir: 0, turnTimer: 0 };
  scene.add(m.mesh);
  mice.push(m);
}
function placeMouse(m) {
  // spawn away from the cat
  let x, z;
  do {
    x = (Math.random() * 2 - 1) * (ARENA - 2);
    z = (Math.random() * 2 - 1) * (ARENA - 2);
  } while (Math.hypot(x - cat.position.x, z - cat.position.z) < 6);
  m.mesh.position.set(x, 0, z);
  m.dir = Math.random() * Math.PI * 2;
  m.turnTimer = 0;
}

// ---------- input ----------
const keys = {};
const KEYMAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
                 KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code === 'Space') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'playing') { if (catState.y <= 0) catState.vy = JUMP_SPEED; }
    else startGame();
  }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- game state ----------
let state = 'start', score = 0, timeLeft = ROUND_TIME;
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const overlay = document.getElementById('overlay');

function startGame() {
  score = 0; timeLeft = ROUND_TIME;
  cat.position.set(0, 0, 0); cat.rotation.y = 0;
  Object.assign(catState, { vx: 0, vz: 0, vy: 0, y: 0 });
  mice.forEach(placeMouse);
  updateHud();
  overlay.classList.add('hidden');
  state = 'playing';
}
function endGame() {
  state = 'over';
  document.getElementById('title').textContent = "Time's up!";
  document.getElementById('msg').textContent = 'You caught ' + score + (score === 1 ? ' mouse.' : ' mice.');
  overlay.querySelector('p:last-child b').textContent = 'Press Space to play again';
  overlay.classList.remove('hidden');
}
function updateHud() {
  scoreEl.textContent = 'Score: ' + score;
  timeEl.textContent = 'Time: ' + Math.ceil(timeLeft);
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function updateCat(dt) {
  let ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  let iz = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  const len = Math.hypot(ix, iz);
  if (len > 0) {
    ix /= len; iz /= len;
    catState.vx += ix * CAT_ACCEL * dt;
    catState.vz += iz * CAT_ACCEL * dt;
  }
  // smooth slow-down
  const damp = Math.exp(-CAT_FRICTION * dt * (len > 0 ? 0.35 : 1));
  catState.vx *= damp; catState.vz *= damp;
  const sp = Math.hypot(catState.vx, catState.vz);
  if (sp > CAT_MAX_SPEED) { catState.vx *= CAT_MAX_SPEED / sp; catState.vz *= CAT_MAX_SPEED / sp; }

  const lim = ARENA - 1;
  cat.position.x = clamp(cat.position.x + catState.vx * dt, -lim, lim);
  cat.position.z = clamp(cat.position.z + catState.vz * dt, -lim, lim);

  // jump
  catState.vy -= GRAVITY * dt;
  catState.y += catState.vy * dt;
  if (catState.y <= 0) { catState.y = 0; catState.vy = 0; }
  cat.position.y = catState.y;

  // face direction of travel, turning smoothly
  if (sp > 0.5) {
    const target = Math.atan2(catState.vx, catState.vz);
    let diff = target - cat.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    cat.rotation.y += diff * Math.min(1, 12 * dt);
  }
}

function updateMice(dt) {
  const lim = ARENA - 1;
  for (const m of mice) {
    const p = m.mesh.position;
    const dx = p.x - cat.position.x, dz = p.z - cat.position.z;
    const d = Math.hypot(dx, dz);
    let speed;
    if (d < 5) {             // flee from the cat
      const away = Math.atan2(dx, dz);
      let diff = Math.atan2(Math.sin(away - m.dir), Math.cos(away - m.dir));
      m.dir += diff * Math.min(1, 6 * dt);
      speed = 6;
    } else {                 // wander
      m.turnTimer -= dt;
      if (m.turnTimer <= 0) { m.dir += (Math.random() - 0.5) * 2.5; m.turnTimer = 0.6 + Math.random() * 1.2; }
      speed = 2.5;
    }
    p.x += Math.sin(m.dir) * speed * dt;
    p.z += Math.cos(m.dir) * speed * dt;
    // bounce off walls
    if (p.x < -lim || p.x > lim) { p.x = clamp(p.x, -lim, lim); m.dir = -m.dir; }
    if (p.z < -lim || p.z > lim) { p.z = clamp(p.z, -lim, lim); m.dir = Math.PI - m.dir; }
    m.mesh.rotation.y = m.dir;

    // caught when the cat touches it
    if (d < CATCH_DIST) {
      score++;
      updateHud();
      placeMouse(m);
    }
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'playing') {
    updateCat(dt);
    updateMice(dt);
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; updateHud(); endGame(); }
    else updateHud();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
mice.forEach(placeMouse);
requestAnimationFrame(frame);
</script>
</body>
</html>
